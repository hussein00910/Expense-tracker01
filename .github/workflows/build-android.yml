name: Build Android APK

on:
  push:
    branches:
      - claude/inspection-planning-3zjlqy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          python3 - <<'PYEOF'
          import struct, zlib

          def make_png(w, h, r, g, b):
              def chunk(tag, data):
                  buf = tag + data
                  return struct.pack('>I', len(data)) + buf + struct.pack('>I', zlib.crc32(buf) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw  = b''.join(b'\x00' + bytes([r, g, b] * w) for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          with open('assets/icon.png',          'wb') as f: f.write(make_png(1024, 1024,  10,  10,  10))
          with open('assets/splash.png',         'wb') as f: f.write(make_png(1242, 2688,  10,  10,  10))
          with open('assets/adaptive-icon.png',  'wb') as f: f.write(make_png(1024, 1024,   0, 255,  65))
          with open('assets/favicon.png',        'wb') as f: f.write(make_png(  48,   48,   0, 255,  65))
          print('Assets created successfully')
          PYEOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (generate Android project)
        run: npx expo prebuild --platform android --no-install

      - name: Generate release keystore
        run: |
          cd android
          keytool -genkey -v \
            -storetype PKCS12 \
            -keystore app/release.keystore \
            -alias releasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Unified Toolkit,O=Security,C=US"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=android123 \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-toolkit-v1.0.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Show APK info
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "SHA256: $(sha256sum $APK)"
